<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SUPERVECTAR SERIES PETICIONES</title>

<style>
:root{
  --bg:#ffffff;
  --card:#f5f5f5;
  --muted:#666;
  --highlight:#ff0000;
  --font-size:16px;
}

body{
  font-family:Inter,system-ui;
  background:linear-gradient(180deg,#ffffff 0%,#f2f2f2 100%);
  color:#111;
  margin:0;
  padding:16px;
  font-size: var(--font-size);
  overflow-x:hidden;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:16px;
}

h1{
  font-size:20px;
  margin:0;
  color:var(--highlight);
  font-weight:900;
  text-shadow:0 0 6px rgba(255,0,0,0.3);
}

input[type=search], select{
  padding:12px 16px;
  border-radius:10px;
  border:1px solid rgba(0,0,0,0.2);
  background:var(--highlight);
  color:#fff;
  font-weight:bold;
  font-size:16px;
}

/* ✅ PLACEHOLDER EN BLANCO */
input[type=search]::placeholder{
  color:#fff;
  opacity:1;
}

h2{
  margin-top:24px;
  color:var(--highlight);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
  scroll-behavior:smooth;
  overflow-x:auto;
}

.card{
  cursor:pointer;
  border-radius:8px;
  overflow:hidden;
  outline:none;
  transition: transform 0.2s, box-shadow 0.2s;
  background:var(--card);
}

.card:hover, .card:focus{
  transform: scale(1.05);
  box-shadow:0 8px 20px rgba(255,0,0,0.4);
}

.card .img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:8px;
}

.card .title{
  font-weight:700;
  font-size:14px;
  margin-top:4px;
}

.card .meta{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.pagination{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:12px;
}

.pagination button{
  padding:10px 14px;
  border-radius:6px;
  border:1px solid #111;
  background:transparent;
  color:#111;
  cursor:pointer;
  font-size:14px;
}

.pagination button.active{
  background:var(--highlight);
  color:#fff;
}

.pagination button:hover, .pagination button:focus{
  background:var(--highlight);
  color:#fff;
  outline:none;
}

.grid::-webkit-scrollbar{
  display:none;
}
</style>
</head>

<body>

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="https://i.ibb.co/7dGjZb80/6.jpg" style="height:42px;width:42px;border-radius:50%;object-fit:cover;">
    <div><h1>SUPERVECTAR SERIES (PETICIONES)</h1></div>
  </div>

  <div class="controls" style="display:flex;gap:8px;flex-wrap:wrap;">
    <input id="search" type="search" placeholder="Buscar...">

    <select id="genre-filter">
      <option value="all">Género</option>  
      <option value="Acción">Acción</option>
      <option value="Comedia">Comedia</option>
      <option value="Drama">Drama</option>
      <option value="Infantil">Infantil</option>      
      <option value="Sci-Fi">Sci-Fi</option>
      <option value="Thriller">Thriller</option>	  
      <option value="Terror">Terror</option>
    </select>

    <select id="filterYear" style="width:100px">
      <option value="">Año</option>
    </select>
  </div>
</header>

<div id="notice">
  ⚠️ Para acceder a algunas webs necesitas estar conectado a un servidor VPN:
  <a href="https://one.one.one.one/es-ES/" target="_blank">Descargar aqui VPN WARP 1.1.1.1</a> 

</div>

<main>
  <h2>Series</h2>
  <div id="movies-grid" class="grid"></div>
  <div id="movies-pagination" class="pagination"></div>
</main>

<script>
const mediaData = [

  { id:'v', title:'V los visitantes (serie completa)', year:1983, genre:'Sci-Fi', poster:'https://es.web.img2.acsta.net/r_1920_1080/medias/nmedia/18/66/41/37/19616727.jpg', link:'https://supervectar-coder.github.io/VERV/'},      
  { id:'pippi1', title:'Pippi Capitulo 1', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZD9AX7ZHRPBhP1c8SjSEDXaLDWN3zo9qtkV'},      
  { id:'pippi2', title:'Pippi Capitulo 2', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZn9AX7Z6A6im5KyVFS66QDPJTsBRuTO2V2k'},      
  { id:'pippi3', title:'Pippi Capitulo 3', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZT9AX7ZIJbaMgqn4QyI8mYtjfQGHuLW3LSV'},      
  { id:'pippi4', title:'Pippi Capitulo 4', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZP9AX7ZBkWQeGPBu8Y32czz46mJizbzJFtk'},      
  { id:'pippi5', title:'Pippi Capitulo 5', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZw9AX7ZaaF55lOKHBzdyiffCh2OvVlCH3SX'},      
  { id:'pippi6', title:'Pippi Capitulo 6', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZq9AX7ZxJ4OYGsAr1ui0S5aVhCXiS4nw56V'},      
  { id:'pippi7', title:'Pippi Capitulo 7', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZ69AX7ZDKhN0WFnKBzlWABnyniyJk2kzDFk'},      
  { id:'pippi8', title:'Pippi Capitulo 8', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZI9AX7ZB4T6JfDf47pm8eT75vJyR5lkKIi7'},      
  { id:'pippi9', title:'Pippi Capitulo 9', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZa9AX7ZxhJxvTK1O0k5yGzeancl6QOfBndX'},      
  { id:'pippi10', title:'Pippi Capitulo 10', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZ39AX7Zi9Ayi55uL6u5mXRj4Kw8oyPlBtHy'},      
  { id:'pippi11', title:'Pippi Capitulo 11', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZr9AX7Zlmj5wHgP3Ymx0MGcrMdVHphBGK6V'},      
  { id:'pippi12', title:'Pippi Capitulo 12', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZyMAX7ZavOkLHzYF5mw8TpQJvjUI4dIXSJ7'},      
  { id:'pippi13', title:'Pippi Capitulo 13', year:1969, genre:'Infantil', poster:'https://img.webme.com/pic/o/oscaradaynet/Pippi%20Calzaslargas.jpg', link:'https://e.pcloud.link/publink/show?code=XZVMAX7ZQb57b0Q7CY8yc6vNbhavA8CK5lOy'},      

];

let itemsPerPage = 200; 
let moviePage = 1;
let filteredData = mediaData;
let movieFocus = 0;

const searchEl = document.getElementById('search');
const genreEl = document.getElementById('genre-filter');
const yearEl = document.getElementById('filterYear');
const moviesEl = document.getElementById('movies-grid');
const moviesPagEl = document.getElementById('movies-pagination');

[...new Set(mediaData.map(i=>i.year))].sort((a,b)=>b-a).forEach(y=>{
  const o=document.createElement('option');
  o.value=y;
  o.textContent=y;
  yearEl.appendChild(o);
});

function renderMovies(data){
  const movies = data;
  const totalPages = Math.ceil(movies.length/itemsPerPage) || 1;
  if(moviePage>totalPages) moviePage=totalPages;

  const start = (moviePage-1)*itemsPerPage;
  const end = start + itemsPerPage;

  moviesEl.innerHTML='';
  movies.slice(start,end).forEach((item)=>{
    const div=document.createElement('div');
    div.className='card';
    div.tabIndex=0;
    div.innerHTML=`
      <img class="img" src="${item.poster}">
      <div class="info">
        <div class="title">${item.title}</div>
        <div class="meta">${item.year} • ${item.genre}</div>
      </div>`;
    div.onclick=()=>window.open(item.link,'_blank');
    moviesEl.appendChild(div);
  });

  moviesPagEl.innerHTML='';
  for(let i=1;i<=totalPages;i++){
    const btn=document.createElement('button');
    btn.textContent=i;
    if(i===moviePage) btn.classList.add('active');
    btn.onclick=()=>{
      moviePage=i;
      movieFocus=0;
      renderMovies(filteredData);
    };
    moviesPagEl.appendChild(btn);
  }
}

function applyFilters(){
  const q = searchEl.value.toLowerCase();
  const genre = genreEl.value;
  const year = yearEl.value;

  filteredData = mediaData.filter(m=>
    (genre==='all'||m.genre===genre) &&
    (!year||String(m.year)===year) &&
    m.title.toLowerCase().includes(q)
  );

  moviePage=1;
  movieFocus=0;
  renderMovies(filteredData);
}

searchEl.oninput=genreEl.onchange=yearEl.onchange=applyFilters;

renderMovies(mediaData);
</script>

</body>
</html>
